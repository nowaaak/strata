name: strata-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: strata
      MYSQL_DATABASE: strata
    ports:
      - "127.0.0.1:33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pstrata"]
      interval: 2s
      timeout: 5s
      retries: 60

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: strata
      MARIADB_DATABASE: strata
    ports:
      - "127.0.0.1:33307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "strata"]
      interval: 2s
      timeout: 5s
      retries: 60

  postgres-tls:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "strata"]
      interval: 2s
      timeout: 5s
      retries: 60

  ssh:
    build:
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh \
            && ssh-keygen -A \
            && adduser -D tunnel \
            && echo "tunnel:strata" | chpasswd \
            && sed -i -e 's/^#\?AllowTcpForwarding.*/AllowTcpForwarding yes/' \
                -e 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config \
            && mkdir -p /home/tunnel/.ssh /keys \
            && ssh-keygen -q -t ed25519 -N "" -f /keys/client \
            && ssh-keygen -q -t ed25519 -N "geheim" -f /keys/client_protected \
            && cat /keys/client.pub /keys/client_protected.pub > /home/tunnel/.ssh/authorized_keys \
            && chown -R tunnel:tunnel /home/tunnel/.ssh \
            && chmod 700 /home/tunnel/.ssh \
            && chmod 600 /home/tunnel/.ssh/authorized_keys \
            && chmod 644 /keys/client /keys/client_protected
        CMD ["/usr/sbin/sshd", "-D", "-e"]
    ports:
      - "127.0.0.1:2222:22"
