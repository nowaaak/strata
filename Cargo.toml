[workspace]
resolver = "3"
members = ["crates/strata-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
strata-core = { path = "crates/strata-core" }
futures-util = "0.3"
keyring = "4.2"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
postgres-protocol = "0.6"
rusqlite = { version = "0.43", features = ["bundled", "column_decltype"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
serde ={ version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
ts-rs = "12.0"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
